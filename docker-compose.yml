services:
  postgres:
    image: postgres:16-alpine
    container_name: cms-keystone-db
    restart: unless-stopped
    env_file:
      - .env.db
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    command:
      - "postgres"
      - "-c"
      - "password_encryption=scram-sha-256"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "ssl=off"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_statement=ddl"
    ports:
      - "0.0.0.0:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cms-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID

networks:
  cms-internal:
    driver: bridge
    internal: false

volumes:
  pgdata:

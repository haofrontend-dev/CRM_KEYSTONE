services:
  postgres:
    image: postgres:16-alpine
    container_name: cms-keystone-db
    restart: unless-stopped
    env_file:
      - .env.db
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    command:
      - "postgres"
      - "-c"
      - "password_encryption=scram-sha-256"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "ssl=off"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_statement=ddl"
    ports:
      # Chỉ bind localhost (admin tool / build). App container nối DB nội bộ qua
      # service name `postgres:5432`. KHÔNG để 0.0.0.0 (phơi DB ra internet).
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cms-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID

  # ---- App replicas (Payload + Next.js) behind the nginx LB ----
  app1:
    <<: &app-base
      build:
        context: .
        network: host          # build needs DB at 127.0.0.1:5435
        args:
          # NEXT_PUBLIC_* is inlined into the public client bundle (not a secret).
          NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        secrets:
          # Passed via BuildKit mounts -> not baked into image history.
          - payload_secret
          - database_uri_build
      image: cms-keystone-app:latest
      restart: unless-stopped
      environment:
        NODE_ENV: production
        # Secrets come from .env (gitignored), never hardcoded here.
        # Internal URI reaches Postgres over the docker network (postgres:5432).
        DATABASE_URI: ${DATABASE_URI_INTERNAL}
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        RESEND_API_KEY: ${RESEND_API_KEY}
        RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
        CONTACT_ADMIN_EMAIL: ${CONTACT_ADMIN_EMAIL}
      volumes:
        # Bind host ./media so existing uploads are served + new uploads persist,
        # shared across all 3 replicas.
        - ./media:/app/media
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - cms-internal
        - edge
    container_name: cms-app-1

  app2:
    <<: *app-base
    container_name: cms-app-2

  app3:
    <<: *app-base
    container_name: cms-app-3

secrets:
  payload_secret:
    environment: PAYLOAD_SECRET
  database_uri_build:
    environment: DATABASE_URI

networks:
  cms-internal:
    driver: bridge
    internal: false
  # Shared with the global nginx LB (infra-lb). Created externally:
  #   docker network create edge
  edge:
    external: true

volumes:
  pgdata:
